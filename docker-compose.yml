services:
  immich-dlna:
    build:
      context: .
      dockerfile: Dockerfile
    image: immich-dlna:latest
    container_name: immich-dlna
    restart: unless-stopped
    # CRITICAL: host networking is REQUIRED for DLNA / SSDP multicast (UDP port 1900)
    # to be discovered by Smart TVs and clients on your local area network.
    network_mode: host
    env_file:
      - .env
    environment:
      # Defaults if not provided in .env
      - IMMICH_URL=${IMMICH_URL}
      - IMMICH_API_TOKEN=${IMMICH_API_TOKEN}
      - IMMICH_VERIFY_SSL=${IMMICH_VERIFY_SSL:-true}
      - IMMICH_DLNA_FRIENDLY_NAME=${IMMICH_DLNA_FRIENDLY_NAME:-Immich}
      - IMMICH_DLNA_HTTP_PORT=${IMMICH_DLNA_HTTP_PORT:-8200}
      - IMMICH_DLNA_BASE_URL=${IMMICH_DLNA_BASE_URL:-}
      - IMMICH_DLNA_ENABLE_TIMELINE=${IMMICH_DLNA_ENABLE_TIMELINE:-false}
      - IMMICH_DLNA_ENABLE_YEARS=${IMMICH_DLNA_ENABLE_YEARS:-true}
      - IMMICH_DLNA_ENABLE_YEAR_ALL=${IMMICH_DLNA_ENABLE_YEAR_ALL:-true}
      - IMMICH_DLNA_ENABLE_ALBUMS=${IMMICH_DLNA_ENABLE_ALBUMS:-true}
      - IMMICH_DLNA_ENABLE_VIDEOS=${IMMICH_DLNA_ENABLE_VIDEOS:-true}
      - IMMICH_DLNA_ENABLE_PEOPLE=${IMMICH_DLNA_ENABLE_PEOPLE:-true}
      - IMMICH_DLNA_SHOW_UNNAMED_PEOPLE=${IMMICH_DLNA_SHOW_UNNAMED_PEOPLE:-false}
      - IMMICH_DLNA_PEOPLE_SORT=${IMMICH_DLNA_PEOPLE_SORT:-both}
      - IMMICH_DLNA_ENABLE_FAVORITES=${IMMICH_DLNA_ENABLE_FAVORITES:-true}
      - IMMICH_DLNA_ENABLE_TAGS=${IMMICH_DLNA_ENABLE_TAGS:-true}
      - IMMICH_DLNA_TAGS_GROUP_BY_LETTER=${IMMICH_DLNA_TAGS_GROUP_BY_LETTER:-auto}
      - IMMICH_DLNA_IMAGE_QUALITY=${IMMICH_DLNA_IMAGE_QUALITY:-auto}
      - IMMICH_DLNA_PREFER_JPEG=${IMMICH_DLNA_PREFER_JPEG:-true}
      - IMMICH_DLNA_TRANSCODE_WEBP_TO_JPEG=${IMMICH_DLNA_TRANSCODE_WEBP_TO_JPEG:-true}
      - IMMICH_DLNA_NUMBER_PEOPLE=${IMMICH_DLNA_NUMBER_PEOPLE:-true}
      - IMMICH_DLNA_NUMBER_YEARS=${IMMICH_DLNA_NUMBER_YEARS:-true}
      - IMMICH_DLNA_NUMBER_ASSETS=${IMMICH_DLNA_NUMBER_ASSETS:-true}
      - IMMICH_DLNA_ASSET_TITLE_FORMAT=${IMMICH_DLNA_ASSET_TITLE_FORMAT:-index_filename}
      - IMMICH_DLNA_LOG_LEVEL=${IMMICH_DLNA_LOG_LEVEL:-INFO}
      - AIOHTTP_NO_EXTENSIONS=1
