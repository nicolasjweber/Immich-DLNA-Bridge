[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "immich-dlna"
version = "1.0.0"
description = "Immich DLNA/UPnP Media Server bridge with People, Albums, Favorites, and TV compatibility"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "pillow>=10.0,<12",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
immich-dlna = "immich_dlna.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_dlna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
